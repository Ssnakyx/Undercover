services:
  - type: web
    name: lolcover-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      # Comptes joueurs : URL Postgres (Neon conseillé), à saisir dans le dashboard Render.
      - key: DATABASE_URL
        sync: false
